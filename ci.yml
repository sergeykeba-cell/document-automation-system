name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff black

      - name: Run ruff
        run: ruff check app/

      - name: Check formatting with black
        run: black --check app/

  smoke-test:
    name: Smoke test (app boots)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start app and check health
        env:
          SECRET_KEY: ci_test_secret
          DATABASE_URL: sqlite:///./data/test.db
        run: |
          mkdir -p data
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 5
          curl --fail http://localhost:8000/docs || (echo "App did not start correctly" && exit 1)
